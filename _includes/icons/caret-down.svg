{%- comment -%}
  The dropdown caret, inlined so `fill="currentColor"` follows the theme and
  hover colour of the text beside it. Space Grotesk has no caret glyph, which
  is why this is an SVG rather than a character. Sized by .dropdown-arrow; keep
  it inside --nav-arrow-slot or the measured nav width changes.
{%- endcomment -%}
<svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
  <path d="M7 8.5h10a1 1 0 0 1 .7 1.7l-5 5a1 1 0 0 1-1.4 0l-5-5A1 1 0 0 1 7 8.5Z" fill="currentColor"/>
</svg>
