# Site settings. `title` and `description` feed jekyll-seo-tag (<title>, meta
# description, Open Graph). `url` + `baseurl` make every absolute URL; see the
# README ("URLs and the custom domain") before changing either. CI overrides
# both from the GitHub Pages settings, so these are the local-build values.
title: TPCB
description: >
  The Tri-Institutional PhD Program in Chemical Biology (TPCB) at Weill Cornell
  Medicine, The Rockefeller University, and Memorial Sloan Kettering Cancer Center
  trains the next generation of chemical biologists in New York City.
url: https://adavasam.github.io
baseurl: /tpcb-website

# assets/css/site.scss is plain CSS assembled from _includes/css/; Sass only
# strips the comments and whitespace on the way out.
sass:
  style: compressed
  sourcemap: never

markdown: kramdown
kramdown:
  input: GFM

# `pretty` gives pages without their own `permalink:` a trailing-slash URL.
permalink: pretty
# Build future-dated news too, so the homepage and /news/ never list an item
# that has no page.
future: true

# Fail the build on a front-matter typo or an unknown Liquid filter instead of
# silently rendering wrong output.
strict_front_matter: true
liquid:
  strict_filters: true

collections:
  news:
    output: true
    # Files live in _news/YYYY/MM-short-title.md. The URL takes the year from
    # the document's `date:` and the name from the filename, so it does not
    # depend on the folder. Keep the year: short titles repeat across years
    # (e.g. 05-graduates), and without it those pages overwrite each other
    # with only a "Conflict" warning.
    permalink: /news/:year/:name/
  faculty:
    output: true
    permalink: /faculty/:path/
  students:
    output: true
    permalink: /students/:path/

defaults:
  # The social-sharing card for every page (1200x630, the TPCB wordmark on
  # white). jekyll-seo-tag reads `image` from the page, not the site, so it has
  # to be a default here. Without it, link previews use the first <img> on the
  # page — the Weill Cornell building on the homepage.
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png
  - scope:
      path: ""
      type: news
    values:
      layout: post
  - scope:
      path: ""
      type: faculty
    values:
      layout: faculty-profile
  - scope:
      path: ""
      type: students
    values:
      layout: profile

# `include` beats `exclude`: the font licence has to ship next to the font, but
# "*.txt" below matches at every depth.
include:
  - _pages
  - assets/fonts/OFL.txt

# Jekyll copies any root file it does not recognise into _site, so everything
# here that is not site content must be listed — the CSVs hold every faculty
# email address. Several of these files are local-only (see .gitignore).
exclude:
  - README.md
  - NOTICE
  - "*.txt"
  - "*.csv"
  - tools/
  - .crawl/
  - .images/
  - CLAUDE.md
  - HANDOFF.md
  - TOOLS.md
  - AUDIT-*.md
  - ADMIN-GUIDE.md
  - CLAUDE-CODE-BRIEF.md
  - REBUILD-PROMPT.md
  - build_faculty_directory.md
  - tpcb_landing_example.html

# The Gemfile's :jekyll_plugins group decides what loads; keep this in step.
plugins:
  - jekyll-scholar
  - jekyll-seo-tag
  - jekyll-sitemap

# Builds /publications/ from _bibliography/papers.bib through _layouts/bib.html.
# Do not add a _layouts/bibtex.html: jekyll-scholar would then generate a
# details page for every one of the 658 entries.
scholar:
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  sort_by: year,month
  order: descending
  group_by: year
  group_order: descending
