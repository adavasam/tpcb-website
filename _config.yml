# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
# No theme. `remote_theme: alshedivat/al-folio` used to sit here and was pure
# liability: every layout, include and stylesheet this site uses is local
# (_layouts/ has all eight, _includes/ the one), al-folio's own CSS was never
# loaded, and nothing resolved through it. What it did do was make every build
# fetch a tarball from GitHub over the network — which is a hard failure, not a
# slow one, when that connection is unavailable. Builds are offline now.
# accent_color: "#1a4a8a"

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
rss_icon: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------
navbar_fixed: true
footer_fixed: false
search_enabled: false
socials_in_search: false
bib_search: false

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# The link preview. Without this, scrapers fall back to the first <img> they
# find in the document — which on the homepage is the Weill Cornell building,
# so every shared link looked like it was about WCM.
#
# The image itself is assets/img/social-card.png — 1200x630, the size Open
# Graph asks for and large enough for Twitter's summary_large_image, with the
# TPCB wordmark at native resolution on white. It is generated rather than
# drawn; the compositing step is recorded in HANDOFF.md.
#
# It is wired up in the `defaults:` block further down, NOT here: jekyll-seo-tag
# reads `image` from the page, so a site-level key emits nothing at all. The
# `og_image` key below is al-folio's and does nothing now that the theme is
# gone; it is left only so the block's shape matches upstream.
og_image:

