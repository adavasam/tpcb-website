# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------
blog_name: TPCB News
blog_description: News and updates from the Tri-Institutional PhD Program in Chemical Biology
permalink: /news/:year/:title/
lsi: false
future: false
pagination:
  enabled: true
  per_page: 10
  permalink: "/news/page/:num/"
  sort_field: "date"
  sort_reverse: true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  faculty:
    output: true
    permalink: /faculty/:path/
  students:
    output: true
    permalink: /students/:path/
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  # The link preview, applied to every page. jekyll-seo-tag reads `image` from
  # the PAGE, not the site — a site-level `image:` key emits nothing — so the
  # default has to be injected here. Setting it also flips twitter:card from
  # `summary` to `summary_large_image`, which is what renders the 1200x630
  # card rather than a thumbnail. Any page can override by declaring its own
  # `image:` in front matter.
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png
  - scope:
      path: ""
      type: news
    values:
      layout: post
  - scope:
      path: ""
      type: faculty
    values:
      layout: faculty-profile
  - scope:
      path: ""
      type: students
    values:
      layout: profile

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# `_pages` because a leading underscore is otherwise skipped. The font licence
# because `exclude: "*.txt"` below matches at every depth, not just the root,
# and it swallowed assets/fonts/OFL.txt — the SIL Open Font License requires the
# notice to accompany the font wherever the font goes, so it has to be served
# next to the woff2, not merely sit in the repo. `include` beats `exclude`.
include: ["_pages", "assets/fonts/OFL.txt"]
exclude:
  - bin/
  - CLAUDE-CODE-BRIEF.md
  - docker-compose.yml
  - docker-compose-slim.yml
  - Makefile
  - "*.sh"
  - "*.txt"
  - "*.bib.backup"
  # Working files. Jekyll copies anything at the repo root it does not
  # recognise straight into _site/, so without these the source spreadsheets
  # (every faculty email, plus the education data we found to be wrong), the
  # 960KB design export, and the internal build notes were all being published.
  - "*.csv"
  - tpcb_landing_example.html
  - REBUILD-PROMPT.md
  - build_faculty_directory.md
  - ADMIN-GUIDE.md
  - .crawl/
  - .images/
  - HANDOFF.md
  - CLAUDE.md
  - TOOLS.md
  - tools/

keep_files:
  - CNAME
  - .nojekyll
  - assets

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-scholar
  - jekyll-paginate
  - jekyll-email-protect
  - jemoji

# -----------------------------------------------------------------------------
# jekyll-scholar
# -----------------------------------------------------------------------------
scholar:
  last_name: [TPCB]
  first_name: []
  style: apa
  locale: en
  sort_by: year,month
  order: descending
  group_by: year
  group_order: descending
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
